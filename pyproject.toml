[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funcpatch"
version = "0.1.0"
description = "Runtime function implementation override for Python — one target, one owner, zero source changes."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "funcpatch contributors" }]
keywords = ["plugin", "monkey-patch", "override", "import-hook", "wrapt", "customization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # resolve_owner / scoped_function_wrapper / find_wrapper 自 2.4 引入；
    # with_doc 与 with_signature(doc=) 自 2.5 引入并由 bridge 透传，故最低 2.5。
    "wrapt>=2.5",
]

[project.optional-dependencies]
toml = ["tomli>=2.0; python_version<'3.11'"]
web = ["fastapi>=0.100", "httpx>=0.24", "uvicorn>=0.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6", "basedpyright>=1.20"]

[project.scripts]
funcpatch = "funcpatch.cli:main"

[project.urls]
Homepage = "https://github.com/isfangmk/funcpatch"
Repository = "https://github.com/isfangmk/funcpatch"
Issues = "https://github.com/isfangmk/funcpatch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 固定临时目录到仓库内：部分环境下的系统临时目录可能不可写，
# 导致 tmp_path fixture 抛 PermissionError 而非真实测试失败。
# 只用单层目录名——pytest 不会为 basetemp 创建父目录，
# 写成 ".pytest_basetemp/run" 在干净检出（父目录不存在）时会失败。
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.basedpyright]
include = ["src", "tests", "tools"]
extraPaths = ["src", "tools"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
reportDeprecated = true
reportUnusedImport = true
reportMissingImports = "warning"

[tool.coverage.run]
source = ["funcpatch"]
branch = true
omit = ["tests/*", "*/funcpatch/cli/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
