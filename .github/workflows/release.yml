name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev,toml,web]"

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 直接读源码，不依赖安装方式（可编辑安装会让 import 指向源码树）
          VERSION="$(python -c "
          import re, pathlib
          text = pathlib.Path('src/funcpatch/__init__.py').read_text(encoding='utf-8')
          print(re.search(r'^__version__ = \"([^\"]+)\"', text, re.M).group(1))
          ")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package version $VERSION"
            exit 1
          fi

      - name: Quality gate
        run: |
          ruff check .
          ruff format --check .
          basedpyright
          pytest -q --cov=funcpatch --cov-report=term-missing

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          {
            echo "**在不修改任何源码的前提下，用插件完整替换函数实现。一个目标函数，一次部署，只有一个 owner 生效。**"
            echo
            echo "Runtime function implementation override for Python — one target, one owner, zero source changes."
            echo
            echo "---"
            echo
            python tools/changelog_section.py "$VERSION"
            echo
            echo "---"
            echo
            echo "完整变更记录：<https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md>"
            echo
            echo "文档：<https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/USAGE.md>"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
