name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,toml,web]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (basedpyright)
        run: basedpyright

      - name: Verify examples still run
        run: |
          python -m examples.basic.run
          python -m examples.modes.walkthrough

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,toml,web]"

      - name: Test with coverage (pytest)
        run: pytest -q --cov=funcpatch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  package:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate distribution
        run: |
          python -m twine check dist/*
          python -m pip install dist/*.whl
          python -c "import funcpatch; print(funcpatch.__version__)"

      - name: Smoke test installed package
        run: |
          cat > smoke_target.py <<'PY'
          def compute(x: int) -> int:
              return x + 1
          PY
          python -c "
          import smoke_target
          from funcpatch import PatchSpec, Registry, SelectionConfig
          spec = PatchSpec('smoke', 'smoke_target', 'compute', lambda x: x * 2)
          reg = Registry(SelectionConfig('smoke', {}, True), [spec])
          assert reg.apply(spec.target)
          assert smoke_target.compute(21) == 42
          reg.revert_all()
          assert smoke_target.compute(21) == 22
          print('smoke test passed')
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
